[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keystalker"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["pynput", "requests", "APScheduler==3.11.3", "python-dotenv]

[project.scripts]
keystalker = "keystalker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
